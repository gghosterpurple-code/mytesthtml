:root[data-theme="dark"]{color-scheme:dark;--bar:#212d3b;--bg:#17212b;--gap:#0e1621;--tx:#fff;--sub:#6d7f8f;--acc:#5eb5f7;--in:#182533;--out:#2b5278;--meta:#7da8d3;--inmeta:#6d7f8f;--tick:#6ab3f3;--inp:#1c2733;--rip:rgba(255,255,255,.07);--badge:#4a8cc0;--pat:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160' fill='none' stroke='%23fff' stroke-opacity='.045' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='28' cy='30' r='9'/><path d='M96 24v16M88 32h16'/><path d='M130 120c-9-6-14-11-14-17a7 7 0 0114-2 7 7 0 0114 2c0 6-5 11-14 17z'/><path d='M40 100l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1z'/><path d='M96 100l28-10-8 28-6-11z'/></svg>");--wall:radial-gradient(at 20% 8%,#1a2a3b,transparent 60%),radial-gradient(at 85% 90%,#14222f,transparent 60%),#0e1621}
html{height:100%;background:var(--bar)}
body{margin:0;letter-spacing:-.15px;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:16px -apple-system,BlinkMacSystemFont,"Roboto","Segoe UI",system-ui,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";-webkit-tap-highlight-color:transparent;user-select:none}
#app{position:relative;height:100%;overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .3s cubic-bezier(.22,.8,.3,1),opacity .3s}
#chat,#prof{transform:translateX(100%);box-shadow:-4px 0 14px rgba(0,0,0,.2)}
#chat.on,#prof.on{transform:none}
#list.bk,#chat.bk{transform:translateX(-22%);opacity:.6}
#chat{background:var(--bg)}#prof{background:var(--gap)}
.bar{height:56px;flex:none;background:var(--bar);color:#fff;display:flex;align-items:center;padding:0 4px;box-shadow:0 1px 3px rgba(0,0,0,.22);z-index:2}
.ib{width:48px;height:48px;flex:none;border:0;background:none;color:inherit;display:grid;place-items:center;border-radius:50%;padding:0;cursor:pointer;transition:background .15s}
.bar .ib:active{background:rgba(255,255,255,.18)}
svg.i{width:24px;height:24px}
.ttl{flex:1;font-size:20px;font-weight:500;margin-left:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#q{display:none;flex:1;border:0;outline:0;background:none;color:#fff;font-size:18px;margin-left:8px;min-width:0;user-select:text}
#q::placeholder{color:rgba(255,255,255,.7)}
.srch .ttl{display:none}.srch #q{display:block}
.rows{flex:1;overflow-y:auto}
.row{display:flex;align-items:center;padding-left:10px;height:72px;cursor:pointer;transition:background .15s}
.row:active{background:var(--rip)}
.av{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-size:22px;font-weight:500;position:relative}
.av svg.i{width:28px;height:28px;stroke-width:2}
.av.on::after{content:"";position:absolute;right:0;bottom:1px;width:13px;height:13px;border-radius:50%;background:#4cd964;border:2.5px solid var(--bg)}
.rb{flex:1;min-width:0;height:100%;margin-left:12px;padding-right:14px;display:flex;flex-direction:column;justify-content:center;gap:3px;border-bottom:.5px solid var(--div)}
.r1,.r2{display:flex;align-items:center;gap:6px}
.nm{flex:1;font-weight:500;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:3px}
.tm svg{color:var(--tick)}
.pv{flex:1;color:var(--sub);font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv b{color:var(--acc);font-weight:400}
.bd{min-width:22px;height:22px;border-radius:11px;background:var(--badge);color:#fff;font-size:13px;font-weight:500;display:grid;place-items:center;padding:0 6px;box-sizing:border-box}
.fab{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.3);transition:transform .15s}
.fab:active{transform:scale(.92)}
.none{text-align:center;color:var(--sub);padding:40px 16px}
.cav{width:40px;height:40px;font-size:16px;margin-left:2px}.cav svg.i{width:22px;height:22px}
.hb{flex:1;margin-left:14px;min-width:0;line-height:1.25;cursor:pointer}
.hb .n{font-size:17px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .s{font-size:13px;opacity:.78;min-height:16px;margin-top:2px}
.dt i{display:inline-block;width:3px;height:3px;border-radius:50%;background:currentColor;margin-left:2px;animation:bl 1.2s infinite}
.dt i:nth-child(2){animation-delay:.2s}.dt i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
.msgs{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;user-select:text}
.day{align-self:center;background:rgba(0,0,0,.25);color:#fff;font-size:13px;font-weight:500;padding:3px 10px;border-radius:14px;margin:6px 0 2px}
.m{max-width:82%;padding:6px 12px 6px;font-size:16px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.m.in{align-self:flex-start;background:var(--in)}
.m.out{align-self:flex-end;background:var(--out)}
.m.new{animation:pop .18s cubic-bezier(.25,.8,.25,1)}
@keyframes pop{0%{opacity:0;transform:translateY(6px) scale(.96)}100%{opacity:1;transform:none}}
.mt{float:right;margin:6px 0 -3px 8px;font-size:12px;color:var(--inmeta);display:flex;align-items:center;gap:3px;height:15px;user-select:none}

.empty{margin:auto;background:rgba(0,0,0,.28);color:#fff;border-radius:16px;padding:16px 18px;max-width:250px;text-align:center;font-size:14px;line-height:1.35}

.toast.on{opacity:1}
.pbar{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;padding:0 4px;color:#fff;z-index:3;transition:background .2s,box-shadow .2s}

.hd .n2{font-size:22px;font-weight:500}.hd .st{font-size:14px;opacity:.8;margin-top:2px}

.sec{background:var(--bg);margin-bottom:8px;padding:4px 0 6px}
.sh{color:var(--acc);font-size:15px;font-weight:500;padding:12px 16px 6px}

.it:active{background:var(--rip)}.it>svg{color:var(--sub);flex:none}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;padding:8px 0}
.tx b{font-weight:400;font-size:16px}.tx span{font-size:13px;color:var(--sub);margin-top:2px}
.rv{color:var(--sub);font-size:14px}
.sw{width:38px;height:22px;border-radius:11px;background:var(--acc);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:18px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.sw.off{background:#aab2b9}.sw.off::after{left:2px}
.tl{display:flex;gap:8px;padding:12px}
.tl div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0;border-radius:12px;background:var(--rip);color:var(--acc);font-size:12px;cursor:pointer}
.tabs{display:flex;overflow-x:auto;border-bottom:.5px solid var(--div)}
.tab{padding:14px 18px;color:var(--sub);font-weight:500;font-size:15px;position:relative;white-space:nowrap;cursor:pointer}
.tab.on{color:var(--acc)}.tab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--acc)}
.nomed{text-align:center;color:var(--sub);padding:56px 16px}

#chat>*{position:relative}
.md,.shs{position:absolute;inset:0;z-index:8;display:flex;opacity:0;pointer-events:none;transition:opacity .22s;background:rgba(0,0,0,.5)}
.md.on,.shs.on{opacity:1;pointer-events:auto}
.md{align-items:center;justify-content:center;padding:16px}
.cd{width:100%;max-width:340px;background:var(--bg);border-radius:16px;padding:18px 18px 8px;max-height:90%;overflow:auto;box-sizing:border-box;transform:scale(.94);transition:transform .22s}
.md.on .cd{transform:none}
.cd h3{margin:0 0 12px;font-size:19px;font-weight:500}

.bt{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}

.m{cursor:pointer}

.rs.on{opacity:1;transform:none;pointer-events:auto}

['chat','st','prof','reg'].forEach(i=>new MutationObserver(navSync).observe($(i),{attributes:true,attributeFilter:['class']}));
if(!me.own)me.own={};
if(typeof me.stars!=='number'){me.stars=50;me.tx=[{k:'bonus',t:'Подарок от Nethgram',n:50,ts:Date.now(),st:'Выполнено'}];saveMe()}
if(!Array.isArray(me.tx))me.tx=[];
renderList();drw();navSync();
/* анимация и защита от сдвига */
document.addEventListener('pointerdown',e=>{const t=e.target.closest('.row,.it,.mi,.si,.tl div,.bar>.ib,.pbar>.ib');if(!t)return;const r=t.getBoundingClientRect(),d=Math.max(r.width,r.height)*(t.matches('.ib')?1:1.6),s=document.createElement('span');s.className='rip';s.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';t.appendChild(s);setTimeout(()=>s.remove(),400)});
$('app').addEventListener('scroll',e=>{const t=e.target;if(t===$('app')||(t.classList&&(t.classList.contains('scr')||t.classList.contains('rs')))){t.scrollLeft=0;t.scrollTop=0}},true);
/* память пользователя в облаке */
(async()=>{
  const done=()=>$('reg').classList.remove('boot');
  if(!me.reg&&typeof claude!=='undefined'){$('reg').classList.add('boot');setTimeout(done,1800)}
  try{
    if(typeof claude==='undefined')return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    const id=db&&user?await user.id():null;if(!id)return;
    dbDoc=db.doc('data/users/'+id+'/state');
    const s=await dbDoc.get(),la=+localStorage.getItem('tgtest_at')||0;
    if(s.exists){const d=s.data();
      if(d&&d.me&&d.chats&&(d.at>la||!me.reg)){Object.assign(me,d.me);chats=d.chats;try{localStorage.setItem(KEY,JSON.stringify(chats));localStorage.setItem('tgtest_me',JSON.stringify(me));localStorage.setItem('tgtest_at',d.at)}catch(e){}renderList();drw();$('reg').classList.toggle('off',!!me.reg)}
      else push()}
    else if(me.reg)push();
  }catch(e){}finally{done()}
})();
</script>
